let lang='ca',sound=true,st={xp:0,wins:0,draws:0,losses:0,played:0,points:0,mastery:{},form:[]},round=0,a=0,b=0,cur,rev=false,lock=false,mt,ml=false;try{lang=localStorage.getItem('cc_lang')||'ca';st=Object.assign(st,JSON.parse(localStorage.getItem('ccv21')||'{}'));st.mastery=st.mastery||{};st.form=st.form||[]}catch(e){}const $=x=>document.getElementById(x),t=k=>S[lang][k],f=(s,o)=>s.replace(/{(\w+)}/g,(_,k)=>o[k]||''),cn=d=>lang==='ca'?d[2]:d[0],cp=d=>lang==='ca'?d[3]:d[1];function save(){try{localStorage.setItem('ccv21',JSON.stringify(st));localStorage.setItem('cc_lang',lang)}catch(e){}}function beep(ok){if(!sound)return;try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let c=new A(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=ok?680:170;g.gain.value=.05;o.start();o.stop(c.currentTime+.12)}catch(e){}}function hud(){$('xp').textContent=st.xp;$('wins').textContent=st.wins;$('draws').textContent=st.draws;$('losses').textContent=st.losses;$('s1').textContent=a;$('s2').textContent=b;$('minute').textContent=Math.min(90,round*9)+"'";$('time').style.width=round*10+'%'}function pool(){let p=[];DATA.forEach(d=>{let w=PRIORITY.includes(d[0])?3:1;w+=Math.max(0,2-Math.floor((st.mastery[d[0]]||0)/40));for(let i=0;i<w;i++)p.push(d)});return p}
function newMatch(){round=0;a=0;b=0;lock=false;$('result').innerHTML='';$('play').style.display='block';hud();next()}function next(){if(round>=10)return finish();round++;lock=false;$('feedback').textContent='';let p=pool();cur=p[Math.floor(Math.random()*p.length)];rev=Math.random()<.4;let tags=(rev?'<span class="reverse">'+t('rev')+'</span> ':'')+(PRIORITY.includes(cur[0])?'<span class="priority">'+t('prio')+'</span>':'');$('q').innerHTML=tags+'<br>'+f(rev?t('rq'):t('q'),{c:cn(cur),cap:cp(cur)});let opts=[cur];while(opts.length<4){let d=DATA[Math.floor(Math.random()*DATA.length)];if(!opts.includes(d))opts.push(d)}opts.sort(()=>Math.random()-.5);$('answers').innerHTML='';opts.forEach(d=>{let x=document.createElement('button');x.className='ans';x.textContent=rev?cn(d):cp(d);x.onclick=()=>answer(d,x);$('answers').appendChild(x)});hud()}function answer(d,x){if(lock)return;lock=true;let ok=d[0]===cur[0];beep(ok);if(ok){a++;x.classList.add('ok');st.xp+=100;st.mastery[cur[0]]=Math.min(100,(st.mastery[cur[0]]||0)+15);$('feedback').textContent=f(t('goal'),{xp:100})}else{b++;x.classList.add('bad');st.mastery[cur[0]]=Math.max(0,(st.mastery[cur[0]]||0)-5);(function(){var q=[...document.querySelectorAll('.ans')].find(y=>y.textContent===(rev?cn(cur):cp(cur)));if(q)q.classList.add('ok')})();$('feedback').textContent=f(t('wrong'),{c:cn(cur),cap:cp(cur)})}save();hud();setTimeout(next,ok?750:2000)}function finish(){st.played++;let r;if(a>b){st.wins++;st.points+=3;st.form.unshift('W');r=t('win')}else if(a===b){st.draws++;st.points++;st.form.unshift('D');r=t('draw')}else{st.losses++;st.form.unshift('L');r=t('lose')}st.form=st.form.slice(0,5);save();hud();$('play').style.display='none';$('result').innerHTML=`<div style="font-size:58px">${a}-${b}</div><b>${r}</b>`;render()}
function mapNext(){ml=false;document.querySelectorAll('[data-c]').forEach(e=>e.classList.remove('hit','miss'));let p=pool().filter(d=>document.querySelector('[data-c="'+CSS.escape(d[0])+'"]'));mt=p[Math.floor(Math.random()*p.length)];$('mapQ').innerHTML=(PRIORITY.includes(mt[0])?'<span class="priority">'+t('prio')+'</span><br>':'')+f(t('find'),{c:cn(mt)});$('mapF').textContent=''}function mapAns(n,e){if(ml)return;ml=true;let ok=n===mt[0];if(ok)e.classList.add('hit');else{e.classList.add('miss');document.querySelector('[data-c="'+CSS.escape(mt[0])+'"]').classList.add('hit')}$('mapF').textContent=ok?f(t('goal'),{xp:100}):f(t('wrong'),{c:cn(mt),cap:cp(mt)});setTimeout(mapNext,ok?700:1900)}document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>mapAns(e.dataset.c,e));function render(){let teams=[['YOU',st.points,1],['Capital City FC',Math.max(0,st.played*2-1),0],['Europe United',Math.max(0,st.played*2-3),0],['Atlas Athletic',Math.max(0,st.played-2),0]].sort((x,y)=>y[1]-x[1]);$('rows').innerHTML=teams.map((x,i)=>`<div class="row ${x[2]?'me':''}"><b>${i+1}</b><span>${x[2]?t('you'):x[0]}</span><span>${x[1]} pts</span><b>${x[2]?st.wins:''}</b></div>`).join('');$('mastered').textContent=DATA.filter(d=>(st.mastery[d[0]]||0)>=80).length+'/45';$('form').textContent=st.form.join(' ')||'-'}function apply(){$('lang').value=lang;$('title').textContent=t('title');$('winsL').textContent=t('wins');$('drawsL').textContent=t('draws');$('lossesL').textContent=t('losses');$('you').textContent=t('you');$('new').textContent=t('new');$('leagueTitle').textContent=t('league');$('progressTitle').textContent=t('progress');$('masteredL').textContent=t('mastered');$('formL').textContent=t('form');$('guideTitle').textContent=t('guide');$('guideBody').innerHTML=t('body');document.querySelectorAll('.tabs .tab').forEach((e,i)=>e.textContent=t('tabs')[i]);render();save()}
document.querySelectorAll('.tabs .tab').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tabs .tab').forEach(y=>y.classList.remove('active'));document.querySelectorAll('.panel').forEach(y=>y.classList.remove('show'));x.classList.add('active');const panel=$(x.dataset.p);if(!panel)return;panel.classList.add('show');if(x.dataset.p==='map')mapNext();render()});$('new').onclick=newMatch;$('lang').onchange=e=>{lang=e.target.value;apply();newMatch()};$('sound').onclick=()=>sound=!sound;$('info').onclick=()=>$('modal').classList.add('show');$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};

function duelAnswer(d,x){if(duel.lock)return;duel.lock=true;let ok=d[0]===duel.cur[0];x.classList.add(ok?'ok':'bad');if(ok)duel.s[duel.turn]++;else(function(){var q=[...$('duelAnswers').children].find(y=>y.textContent===cp(duel.cur));if(q)q.classList.add('ok')})();$('duelF').textContent=ok?t('goal').replace('{xp}','0'):f(t('wrong'),{c:cn(duel.cur),cap:cp(duel.cur)});duel.round++;duel.turn=1-duel.turn;setTimeout(duelNext,ok?800:1900)}
let peer=null,conn=null,isHost=false,onlineScore=[0,0],onlineRound=0,onlineCur=null;
function roomCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function makePeer(id){if(typeof Peer==='undefined'){throw new Error('PeerJS unavailable')};return new Peer(id)}

function onlineNext(){if(onlineRound>=10){$('onlineQ').textContent=(lang==='ca'?'Partit acabat':'Match finished')+' · '+onlineScore[0]+'-'+onlineScore[1];return}onlineCur=pool()[Math.floor(Math.random()*pool().length)];let idx=DATA.indexOf(onlineCur),opts=[idx];while(opts.length<4){let i=Math.floor(Math.random()*DATA.length);if(!opts.includes(i))opts.push(i)}opts.sort(()=>Math.random()-.5);conn.send({type:'q',idx,opts,round:onlineRound,score:onlineScore});showOnlineQ(idx,opts)}
