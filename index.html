function mapNext(){ml=false;document.querySelectorAll('[data-c]').forEach(e=>e.classList.remove('hit','miss'));let p=pool().filter(d=>document.querySelector('[data-c="'+CSS.escape(d[0])+'"]'));mt=p[Math.floor(Math.random()*p.length)];$('mapQ').innerHTML=(PRIORITY.includes(mt[0])?'<span class="priority">'+t('prio')+'</span><br>':'')+f(t('find'),{c:cn(mt)});$('mapF').textContent=''}function mapAns(n,e){if(ml)return;ml=true;let ok=n===mt[0];if(ok)e.classList.add('hit');else{e.classList.add('miss');document.querySelector('[data-c="'+CSS.escape(mt[0])+'"]').classList.add('hit')}$('mapF').textContent=ok?f(t('goal'),{xp:100}):f(t('wrong'),{c:cn(mt),cap:cp(mt)});setTimeout(mapNext,ok?700:1900)}document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>mapAns(e.dataset.c,e));function render(){let teams=[['YOU',st.points,1],['Capital City FC',Math.max(0,st.played*2-1),0],['Europe United',Math.max(0,st.played*2-3),0],['Atlas Athletic',Math.max(0,st.played-2),0]].sort((x,y)=>y[1]-x[1]);$('rows').innerHTML=teams.map((x,i)=>`<div class="row ${x[2]?'me':''}"><b>${i+1}</b><span>${x[2]?t('you'):x[0]}</span><span>${x[1]} pts</span><b>${x[2]?st.wins:''}</b></div>`).join('');$('mastered').textContent=DATA.filter(d=>(st.mastery[d[0]]||0)>=80).length+'/45';$('form').textContent=st.form.join(' ')||'-'}function apply(){$('lang').value=lang;$('title').textContent=t('title');$('winsL').textContent=t('wins');$('drawsL').textContent=t('draws');$('lossesL').textContent=t('losses');$('you').textContent=t('you');$('new').textContent=t('new');$('leagueTitle').textContent=t('league');$('progressTitle').textContent=t('progress');$('masteredL').textContent=t('mastered');$('formL').textContent=t('form');$('guideTitle').textContent=t('guide');$('guideBody').innerHTML=t('body');document.querySelectorAll('.tab').forEach((e,i)=>e.textContent=t('tabs')[i]);render();save()}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tab').forEach(y=>y.classList.remove('active'));document.querySelectorAll('.panel').forEach(y=>y.classList.remove('show'));x.classList.add('active');$(x.dataset.p).classList.add('show');if(x.dataset.p==='map')mapNext();render()});$('new').onclick=newMatch;$('lang').onchange=e=>{lang=e.target.value;apply();newMatch()};$('sound').onclick=()=>sound=!sound;$('info').onclick=()=>$('modal').classList.add('show');$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};

function duelAnswer(d,x){if(duel.lock)return;duel.lock=true;let ok=d[0]===duel.cur[0];x.classList.add(ok?'ok':'bad');if(ok)duel.s[duel.turn]++;else[...$('duelAnswers').children].find(y=>y.textContent===cp(duel.cur))?.classList.add('ok');$('duelF').textContent=ok?t('goal').replace('{xp}','0'):f(t('wrong'),{c:cn(duel.cur),cap:cp(duel.cur)});duel.round++;duel.turn=1-duel.turn;setTimeout(duelNext,ok?800:1900)}

firebase.initializeApp(firebaseConfig);const fbAuth=firebase.auth(),fbDb=firebase.database();
function netMsg(ca,en){return lang==='ca'?ca:en}function setNet(x){$('netStatus').textContent=x}function code6(){return Math.random().toString(36).slice(2,8).toUpperCase()}
async function ensureAuth(){if(fbAuth.currentUser){myUid=fbAuth.currentUser.uid;return myUid}let u=await fbAuth.signInAnonymously();myUid=u.user.uid;return myUid}
function makeQuestion(){let d=pool()[Math.floor(Math.random()*pool().length)],idx=DATA.indexOf(d),opts=[idx];while(opts.length<4){let i=Math.floor(Math.random()*DATA.length);if(!opts.includes(i))opts.push(i)}opts.sort(()=>Math.random()-.5);return{idx,opts}}
async function createFirebaseRoom(){try{await ensureAuth();isHost=true;setNet(netMsg('Creant sala segura…','Creating secure room…'));for(let tries=0;tries<8;tries++){let code=code6(),r=fbDb.ref('rooms/'+code),snap=await r.once('value');if(!snap.exists()){let q=makeQuestion();await r.set({hostUid:myUid,guestUid:'',status:'waiting',createdAt:firebase.database.ServerValue.TIMESTAMP,expiresAt:Date.now()+7200000,round:0,score1:0,score2:0,question:q,answers:{}});roomId=code;roomRef=r;playerSlot='p1';$('hostCode').textContent=code;$('codeBox').value=code;setNet(netMsg('✅ Sala preparada. Comparteix el codi i mantén aquesta pàgina oberta.','✅ Room ready. Share the code and keep this page open.'));listenRoom();return}}throw new Error('code')}catch(e){setNet(netMsg('No s’ha pogut crear la sala: ','Could not create room: ')+(e.code||e.message))}}

function listenRoom(){if(roomUnsub)roomRef.off('value',roomUnsub);roomUnsub=roomRef.on('value',snap=>{if(!snap.exists()){setNet(netMsg('La sala s’ha tancat','Room closed'));return}renderFirebaseRoom(snap.val())})}
function renderFirebaseRoom(v){if(v.status==='waiting'){setNet(netMsg('Esperant que s’hi afegeixi l’amic…','Waiting for friend to join…'));return}showSub('onlineGame');$('onMe').textContent=playerSlot==='p1'?t('you'):(lang==='ca'?'JUGADOR 2':'PLAYER 2');$('onFriend').textContent=playerSlot==='p1'?(lang==='ca'?'JUGADOR 2':'PLAYER 2'):t('you');$('os1').textContent=playerSlot==='p1'?v.score1:v.score2;$('os2').textContent=playerSlot==='p1'?v.score2:v.score1;if(v.status==='finished'){$('onlineQ').textContent=netMsg('Partit acabat','Match finished')+' · '+v.score1+'-'+v.score2;$('onlineAnswers').innerHTML='';return}if(!v.question)return;if(lastRenderedRound!==v.round){lastRenderedRound=v.round;answeredRound=-1;showFirebaseQ(v)}if(isHost&&v.answers&&v.answers.p1&&v.answers.p2)setTimeout(()=>advanceFirebase(v),900)}
function showFirebaseQ(v){let d=DATA[v.question.idx];$('onlineQ').textContent=f(t('q'),{c:cn(d)});$('onlineAnswers').innerHTML='';v.question.opts.forEach(i=>{let x=document.createElement('button');x.className='ans';x.textContent=cp(DATA[i]);x.onclick=()=>answerFirebase(i,x,v);$('onlineAnswers').appendChild(x)});$('onlineF').textContent=netMsg('Pregunta '+(v.round+1)+' de 10','Question '+(v.round+1)+' of 10')}

let advancing=false;async function advanceFirebase(v){if(advancing)return;advancing=true;try{let add1=v.answers.p1.ok?1:0,add2=v.answers.p2.ok?1:0;if(v.round>=9){await roomRef.update({status:'finished',score1:(v.score1||0)+add1,score2:(v.score2||0)+add2,answers:null});return}let q=makeQuestion();await roomRef.update({round:v.round+1,score1:(v.score1||0)+add1,score2:(v.score2||0)+add2,question:q,answers:null})}finally{advancing=false}}
